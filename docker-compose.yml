version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ats_resume_postgres
    restart: always
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password_secure_2026
      POSTGRES_DB: ats_resumes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_resumes"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats_resume_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://ats_user:ats_password_secure_2026@db:5432/ats_resumes
      - SECRET_KEY=production_ats_builder_secret_key_minimum_32_characters_here_12345
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
      - AI_PROVIDER=fallback
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_resume_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
